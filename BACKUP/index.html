<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Cadastro</title>
</head>

<body class="bg-gray-100">

    <div class="max-w-3xl mx-auto mt-10 px-4">
        <div class="bg-white p-8 rounded-xl shadow">

            <h1 class="text-3xl font-bold mb-6 text-center">
                Cadastro de Usuário
            </h1>

            <form class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>
                    <label for="nome" class="block mb-2">Nome</label>
                    <input
                    type="text"
                    required
                    name="nome"
                    id="nome"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="email" class="block mb-2">Email</label>
                    <input
                    type="email"
                    required
                    name="email"
                    id="email"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="senha" class="block mb-2">Senha</label>
                    <input
                    type="password"
                    required
                    minlength="6"
                    name="senha"
                    id="senha"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="confirmar-senha" class="block mb-2">Confirmar Senha</label>
                    <input
                    type="password"
                    required
                    minlength="6"
                    name="confirmar-senha"
                    id="confirmar-senha"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="nascimento" class="block mb-2">Data de nascimento</label>
                    <input
                    type="date"
                    required
                    name="nascimento"
                    id="nascimento"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="cpf" class="block mb-2">CPF</label>
                    <input
                    type="text"
                    required
                    minlength="11"
                    maxlength="11"
                    placeholder="Digite seu CPF"
                    name="cpf"
                    id="cpf"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="telefone" class="block mb-2">Telefone</label>
                    <input
                    type="tel"
                    required
                    placeholder="(12) 99999-9999"
                    name="telefone"
                    id="telefone"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="cep" class="block mb-2">CEP</label>
                    <input
                    type="text"
                    required
                    placeholder="00000-000"
                    name="cep"
                    id="cep"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="endereco" class="block mb-2">Endereço</label>
                    <input
                    type="text"
                    required
                    autocomplete="street-address"
                    name="endereco"
                    id="endereco"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="numero" class="block mb-2">Número</label>
                    <input
                    type="number"
                    required
                    min="1"
                    name="numero"
                    id="numero"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="cidade" class="block mb-2">Cidade</label>
                    <input
                    type="text"
                    required
                    name="cidade"
                    id="cidade"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div>
                    <label for="estado" class="block mb-2">Estado</label>
                    <select
                    required
                    name="estado"
                    id="estado"
                    class="w-full border rounded-lg p-3"
                    >
                        <option value="">Selecione um estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="PR">Paraná</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="RS">Rio Grande do Sul</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label for="curso" class="block mb-2">Curso</label>
                    <select
                    required
                    name="curso"
                    id="curso"
                    class="w-full border rounded-lg p-3"
                    >
                        <option value="">Selecione um curso</option>
                        <option value="informatica">Informática</option>
                        <option value="redes">Redes</option>
                        <option value="administracao">Administração</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block mb-2">Sexo</label>

                    <div class="flex flex-wrap gap-5">
                        <label class="flex items-center gap-2">
                            <input
                            type="radio"
                            name="sexo"
                            value="Masculino"
                            >
                            Masculino
                        </label>

                        <label class="flex items-center gap-2">
                            <input
                            type="radio"
                            name="sexo"
                            value="Feminino"
                            >
                            Feminino
                        </label>

                        <label class="flex items-center gap-2">
                            <input
                            type="radio"
                            name="sexo"
                            value="Nao informar"
                            >
                            Não informar
                        </label>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block mb-2">Interesses</label>

                    <div class="flex flex-wrap gap-5">
                        <label class="flex items-center gap-2">
                            <input
                            type="checkbox"
                            name="interesses"
                            value="Tecnologia"
                            >
                            Tecnologia
                        </label>

                        <label class="flex items-center gap-2">
                            <input
                            type="checkbox"
                            name="interesses"
                            value="Esportes"
                            >
                            Esportes
                        </label>

                        <label class="flex items-center gap-2">
                            <input
                            type="checkbox"
                            name="interesses"
                            value="Musica"
                            >
                            Música
                        </label>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label for="foto" class="block mb-2">Foto</label>
                    <input
                    type="file"
                    accept="image/*"
                    name="foto"
                    id="foto"
                    class="w-full border rounded-lg p-3"
                    >
                </div>

                <div class="md:col-span-2">
                    <label for="biografia" class="block mb-2">Biografia</label>
                    <textarea
                    name="biografia"
                    id="biografia"
                    maxlength="500"
                    placeholder="Digite uma breve biografia"
                    rows="5"
                    class="w-full border rounded-lg p-3"
                    ></textarea>
                </div>

                <div class="md:col-span-2">
                    <label for="observacoes" class="block mb-2">Observações</label>
                    <textarea
                    name="observacoes"
                    id="observacoes"
                    maxlength="500"
                    placeholder="Digite alguma observação"
                    rows="4"
                    class="w-full border rounded-lg p-3"
                    ></textarea>
                </div>

                <div class="flex items-center gap-2 md:col-span-2">
                    <input
                    type="checkbox"
                    name="termos"
                    id="termos"
                    required
                    >

                    <label for="termos">
                        Aceito os termos
                    </label>
                </div>

                <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white w-full py-3 rounded-lg md:col-span-2"
                >
                    Cadastrar
                </button>

                <button
                type="reset"
                class="bg-gray-500 hover:bg-gray-600 text-white w-full py-3 rounded-lg md:col-span-2"
                >
                    Limpar
                </button>

            </form>

        </div>
    </div>

</body>
</html>
